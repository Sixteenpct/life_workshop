<!doctype html>

<title>生活工坊｜LiouLiou 與小雀</title>
<style>
:root{color-scheme:light;--ink:#514640;--muted:#867b71;--paper:#faf6ef;--line:#e9dfd1;--gold:#a48345}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 10% 0%,#fff2dc 0,transparent 50%),radial-gradient(ellipse at 100% 70%,#f4e8e4 0,transparent 50%),var(--paper);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7;min-height:100vh}main{max-width:1040px;margin:auto;padding:42px 28px 30px}.brand{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--gold);letter-spacing:.08em}.brand svg{width:30px;height:30px}.hero{padding:62px 0 40px;position:relative}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--gold);margin:0 0 12px}h1{font-family:serif;font-weight:600;letter-spacing:.12em;font-size:clamp(40px,7vw,64px);line-height:1.35;margin:0 0 20px;color:#7b6040}.lead{font-size:17px;max-width:540px;color:#7b7065;margin:0}.divider{height:1px;background:linear-gradient(90deg,#d9c49d,transparent);margin:14px 0 30px}.section-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h2{font-size:16px;font-weight:500;margin:0;letter-spacing:.06em}.section-label span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{color:inherit;text-decoration:none;display:flex;flex-direction:column;min-height:270px;padding:30px;border:1px solid #e8d7d5;border-radius:22px;background:linear-gradient(145deg,#fffdfc,#fcf0f1);box-shadow:0 8px 24px #795d4220;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px #795d4228}.card:focus-visible{outline:3px solid #9a7348;outline-offset:5px}.daily{border-color:#e6dbc8;background:linear-gradient(145deg,#fffdf9,#f5ecdf)}.icon{display:grid;place-items:center;width:62px;height:62px;border-radius:19px;background:#f8e0e7;color:#c57a91;margin-bottom:22px}.daily .icon{background:#f0e0c8;color:#b08250}.icon svg{width:38px;height:38px}h3{font-size:25px;letter-spacing:.08em;margin:0 0 7px;font-weight:600;color:#a05e76}.daily h3{color:#977047}.card p{margin:0 0 22px;color:#86756e;font-size:14px}.open{font-size:14px;margin-top:auto;display:flex;gap:12px;align-items:center;color:#a05e76}.daily .open{color:#977047}.open svg{width:18px;height:18px}.future{border:1px dashed #ddcfb9;border-radius:18px;padding:22px 26px;margin-top:25px;display:flex;align-items:center;gap:22px;color:#9a896f;background:#fffaf580}.future strong{font-size:14px;font-weight:500;white-space:nowrap}.future p{font-size:13px;margin:0;color:var(--muted)}footer{margin-top:52px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:#9b8e80;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}footer a{color:inherit;text-underline-offset:4px}@media(max-width:600px){main{padding:28px 20px}.hero{padding:43px 0 30px}.lead{font-size:15px}.grid{grid-template-columns:1fr;gap:18px}.card{min-height:245px;padding:26px}.future{display:block;padding:20px}.future p{margin-top:7px}.section-label span{font-size:11px}footer{margin-top:36px}}@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body><main>
<div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 14 16 5l11 9v13H5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 27V17h8v10M10 11l6 5 6-5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>LiouLiou & 小雀</span></div>
<header class="hero"><p class="eyebrow">LIFE WORKSHOP</p><h1>生活工坊</h1><p class="lead">把日常整理得輕巧一點，<br>也替新的靈感，留一個慢慢長大的地方。</p></header>
<div class="divider"></div>
<section aria-labelledby="tools-title"><div class="section-label"><h2 id="tools-title">日常的小幫手</h2><span>從生活出發，一起做的小工具</span></div><div class="grid">
<a class="card" href="./xiaomiancang/"><div class="icon"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 9c7-9 18-2 14 7 11 2 11 16 0 18 4 9-7 16-14 7-7 9-18 2-14-7-11-2-11-16 0-18-4-9 7-16 14-7Z" fill="currentColor" opacity=".85"/><circle cx="24" cy="25" r="7" fill="#fff9fb"/></svg></div><h3>小棉倉</h3><p>整理衛生棉庫存、補貨與使用記錄。<br>讓每一份安心，都有自己的位置。</p><span class="open">進入小棉倉 <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
<a class="card daily" href="./xiaorichang/"><div class="icon"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="m7 22 17-14 17 14v19H7Z" fill="#fff9f0" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M19 41V28h10v13M4 23 24 6l20 17" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M12 26h5v5h-5m19-5h5v5h-5" fill="currentColor" opacity=".5"/></svg></div><h3>小日倉</h3><p>管理生活用品、存放位置與保存期限。<br>家裡的零零總總，都能好好安放。</p><span class="open">進入小日倉 <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
</div></section>
<aside class="future"><strong>留給下一個靈感</strong><p>小拾倉、新的小程式，或還沒想好名字的作品，都可以在這裡慢慢成形。</p></aside>
<footer><span>LiouLiou 與小雀的工具與創作工坊</span><a href="https://github.com/Sixteenpct/life_workshop">工坊原始碼 ↗</a></footer>
</main></body></html>
